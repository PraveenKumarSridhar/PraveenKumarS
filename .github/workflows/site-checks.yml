name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Article contract, image preflight and production build
        run: bash scripts/build_site.sh "$RUNNER_TEMP/site"
      - name: Rendered metadata, article discovery and links
        run: python3 scripts/check_site.py "$RUNNER_TEMP/site"
      - run: python3 scripts/test_site_checks.py "$RUNNER_TEMP/site"
      - name: Preview serves a rendered build
        run: python3 scripts/test_preview_site.py
      - name: Verify a new article through the complete publishing pipeline
        run: python3 scripts/test_new_article.py
      - run: node scripts/check_browser.cjs "$RUNNER_TEMP/site" .artifacts/browser
      - name: WebKit reading and layout checks
        run: SITE_BROWSER=webkit node scripts/check_browser.cjs "$RUNNER_TEMP/site" .artifacts/browser/webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            .artifacts/browser
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
