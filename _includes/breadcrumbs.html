<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    <li><a href="{{ '/' | relative_url }}">Home</a></li>
    <li><a href="{{ '/notes/' | relative_url }}">Lab Notes</a></li>
    <li aria-current="page">{{ page.title | smartify | strip_html | escape }}</li>
  </ol>
</nav>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "Home", "item": {{ '/' | absolute_url | jsonify }}},
    {"@type": "ListItem", "position": 2, "name": "Lab Notes", "item": {{ '/notes/' | absolute_url | jsonify }}},
    {"@type": "ListItem", "position": 3, "name": {{ page.title | smartify | strip_html | jsonify | replace: '<', '\u003c' }}, "item": {{ page.url | absolute_url | jsonify }}}
  ]
}
</script>
